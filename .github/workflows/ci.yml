name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - name: Check formatting
        run: pnpm exec oxfmt --check .
      - run: pnpm test:workflow
      - name: Install completion test shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install completion test shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - run: pnpm test --coverage
      # --- repository-specific steps (package-content check, size budget, e2e, docs, ...) go here ---
      - run: pnpm package:check
      - run: pnpm docs:build
      - name: Validate generated OpenCLI with the published action
        uses: bhouston/clidoc-action@v1
        with:
          files: docs/generated/clidoc.json
          specification: bcdxn
          format: json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}
          path: |
            coverage/
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && runner.os == 'macOS' && hashFiles('coverage/lcov.info') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  website-browser:
    name: Website browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: SITE_URL=http://127.0.0.1 BASE_URL=/ pnpm docs:build
      - run: pnpm --filter @clidoc/website exec playwright install --with-deps chromium
      - run: pnpm --filter @clidoc/website test:browser
