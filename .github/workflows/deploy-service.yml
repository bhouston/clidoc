name: Deploy service

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: '.'
      build_args:
        required: false
        type: string
        default: ''
      smoke_text:
        required: false
        type: string
        default: ''
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GAR_HOSTNAME: us-central1-docker.pkg.dev
      PROJECT_ID: bhouston-general-hosting
      REGION: us-central1
      DOCKER_REGISTRY: shared-docker-registry
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.GAR_HOSTNAME }} --quiet
      - name: Set image path
        run: echo "IMAGE_PATH=${{ env.GAR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REGISTRY }}/${{ inputs.service_name }}:${{ github.sha }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PATH }}
          build-args: ${{ inputs.build_args }}
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service_name }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_PATH }}
          flags: '--allow-unauthenticated'
      - name: Report service URL
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Deployed service: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public site
        if: inputs.smoke_text != ''
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_TEXT: ${{ inputs.smoke_text }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 "$SERVICE_URL" -o /tmp/deployed-site.html && grep -Fqi "$SMOKE_TEXT" /tmp/deployed-site.html; then
              echo "HTTP smoke check passed: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Smoke check attempt $attempt failed; retrying in 5 seconds"
            sleep 5
          done
          echo "HTTP smoke check failed: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
          exit 1
