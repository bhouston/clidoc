name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the release without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Release must be dispatched with --ref main, not ${{ github.ref }}." >&2
            exit 1
          fi
  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require published package baselines
        run: node scripts/check-release-baselines.mjs
      - run: pnpm build
      - name: Verify built packages include declared files
        run: node scripts/check-release-package.mjs
      - name: Publish with npm trusted publishing
        run: pnpm release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
      - name: Summarize
        if: always()
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run complete; no packages were published and no tags were created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Review this run's package release logs and GitHub Releases for the publishing result." >> "$GITHUB_STEP_SUMMARY"
          fi
