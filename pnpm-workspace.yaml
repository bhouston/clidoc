packages:
  - 'packages/*'
  - 'demos/*'
allowBuilds:
  core-js: false
  esbuild: true
overrides:
  source-map-js: ^1.2.2
  tinypool: ^2.1.2
  shell-quote: ^1.12.0
  handlebars: ^4.7.10
  follow-redirects: ^1.16.2
  launch-editor: ^2.14.2
  markdown-it: ^14.3.3
  zod: ^4.6.7
  'body-parser@<2': ^1.20.9
  'body-parser@>=2': ^2.4.0
  'undici@>=7': ^7.30.1
  'undici@<7': ^6.29.1
  joi: ^17.13.9
  serialize-javascript: ^7.0.6
  'vitepress>vite': ^6.4.5
  '@vitejs/plugin-vue>vite': ^6.4.5
minimumReleaseAgeExclude:
  - vitest-command-line
  - yargs-file-commands
  - '@vitest/coverage-v8'
  - '@vitest/mocker'
  - '@vitest/spy'
  - vitest
